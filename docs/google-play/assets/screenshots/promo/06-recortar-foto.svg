  <rect width="1080" height="1920" fill="url(#bg)"/><circle cx="950" cy="150" r="250" fill="#FFFFFF" opacity=".26"/>
  <image href="../../branding/promo-header-illustration.png" x="370" y="20" width="340" height="227" preserveAspectRatio="xMidYMid meet"/>
  <text x="540" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="66" font-weight="700" fill="#11131A">Tu foto, justo</text>
  <text x="540" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="66" font-weight="700" fill="#11131A">como la quieres</text>
