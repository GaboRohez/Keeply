  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="75" cy="360" r="190" fill="#FFFFFF" opacity=".25"/><circle cx="1010" cy="170" r="230" fill="#9DAEFF" opacity=".18"/>
